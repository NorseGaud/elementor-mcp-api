name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Release mode
        required: true
        default: bump
        type: choice
        options:
          - bump
          - rerelease
      bump:
        description: Version bump type (ignored when mode is rerelease)
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    name: Tag, zip, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Resolve plugin version
        id: version
        env:
          MODE: ${{ inputs.mode }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          $file = 'mcp-api-for-elementor.php';
          $mode = getenv('MODE') ?: 'bump';
          $bump = getenv('BUMP') ?: 'patch';

          if (!in_array($mode, ['bump', 'rerelease'], true)) {
              fwrite(STDERR, "Invalid mode: {$mode}\n");
              exit(1);
          }
          if ($mode === 'bump' && !in_array($bump, ['patch', 'minor', 'major'], true)) {
              fwrite(STDERR, "Invalid bump type: {$bump}\n");
              exit(1);
          }

          $contents = file_get_contents($file);
          if ($contents === false) {
              fwrite(STDERR, "Unable to read {$file}\n");
              exit(1);
          }
          if (!preg_match('/^\s*\*\s*Version:\s*(.+)$/mi', $contents, $header)) {
              fwrite(STDERR, "Could not parse Version header from {$file}\n");
              exit(1);
          }
          if (!preg_match("/define\(\s*'MCP_API_FOR_ELEMENTOR_VERSION'\s*,\s*'([^']+)'\s*\)/", $contents, $constant)) {
              fwrite(STDERR, "Could not parse MCP_API_FOR_ELEMENTOR_VERSION from {$file}\n");
              exit(1);
          }

          $header_version = trim($header[1]);
          $const_version = trim($constant[1]);
          if ($header_version === '' || $const_version === '') {
              fwrite(STDERR, "Empty version value in {$file}\n");
              exit(1);
          }
          if ($header_version !== $const_version) {
              fwrite(STDERR, "Version mismatch: header={$header_version} constant={$const_version}\n");
              exit(1);
          }
          if (!preg_match('/^(\d+)\.(\d+)\.(\d+)/', $header_version, $parts)) {
              fwrite(STDERR, "Unexpected version format: {$header_version}\n");
              exit(1);
          }

          $readme = 'readme.txt';
          $readme_contents = file_get_contents($readme);
          if ($readme_contents === false) {
              fwrite(STDERR, "Unable to read {$readme}\n");
              exit(1);
          }
          if (!preg_match('/^== Changelog ==\s*$/m', $readme_contents)) {
              fwrite(STDERR, "{$readme} is missing an == Changelog == section\n");
              exit(1);
          }

          $changed_files = false;

          if ($mode === 'rerelease') {
              $new_version = $header_version;
              $previous_version = $header_version;

              if (!preg_match('/^Stable tag:\s*(.+)$/mi', $readme_contents, $stable)) {
                  fwrite(STDERR, "Could not parse Stable tag from {$readme}\n");
                  exit(1);
              }
              $stable_tag = trim($stable[1]);
              if ($stable_tag !== $new_version) {
                  fwrite(STDERR, "rerelease requires Stable tag ({$stable_tag}) to match plugin version ({$new_version})\n");
                  exit(1);
              }

              $version_heading = '/^=\s*' . preg_quote($new_version, '/') . '\s*=\s*$/m';
              if (!preg_match($version_heading, $readme_contents)) {
                  fwrite(STDERR, "rerelease requires \"= {$new_version} =\" under == Changelog == in {$readme}\n");
                  exit(1);
              }

              echo "Rerelease mode: keeping version {$new_version}\n";
          } else {
              $major = (int) $parts[1];
              $minor = (int) $parts[2];
              $patch = (int) $parts[3];
              if ($bump === 'major') {
                  $major++;
                  $minor = 0;
                  $patch = 0;
              } elseif ($bump === 'minor') {
                  $minor++;
                  $patch = 0;
              } else {
                  $patch++;
              }

              $previous_version = $header_version;
              $new_version = "{$major}.{$minor}.{$patch}";
              $changed_files = true;

              $updated = preg_replace(
                  '/^(\s*\*\s*Version:\s*).+$/mi',
                  '${1}' . $new_version,
                  $contents,
                  1,
                  $header_count
              );
              if ($updated === null || $header_count !== 1) {
                  fwrite(STDERR, "Failed to update Version header\n");
                  exit(1);
              }
              $updated = preg_replace(
                  "/(define\(\s*'MCP_API_FOR_ELEMENTOR_VERSION'\s*,\s*')([^']+)('\s*\))/",
                  '${1}' . $new_version . '${3}',
                  $updated,
                  1,
                  $const_count
              );
              if ($updated === null || $const_count !== 1) {
                  fwrite(STDERR, "Failed to update MCP_API_FOR_ELEMENTOR_VERSION\n");
                  exit(1);
              }
              if (file_put_contents($file, $updated) === false) {
                  fwrite(STDERR, "Failed to write {$file}\n");
                  exit(1);
              }

              $readme_updated = preg_replace(
                  '/^Stable tag:\s*.+$/mi',
                  'Stable tag: ' . $new_version,
                  $readme_contents,
                  1,
                  $stable_count
              );
              if ($readme_updated === null || $stable_count !== 1) {
                  fwrite(STDERR, "Failed to update Stable tag in {$readme}\n");
                  exit(1);
              }

              // Ensure Changelog has a = {new_version} = block (keep hand-written if present).
              $version_heading = '/^=\s*' . preg_quote($new_version, '/') . '\s*=\s*$/m';
              if (!preg_match($version_heading, $readme_updated)) {
                  $bullets = [];
                  $prev_tag = 'v' . $previous_version;
                  $log_cmd = 'git log ' . escapeshellarg($prev_tag) . '..HEAD --pretty=format:%s --no-merges 2>/dev/null';
                  $log_out = shell_exec($log_cmd);
                  if (is_string($log_out) && $log_out !== '') {
                      foreach (preg_split("/\r\n|\n|\r/", trim($log_out)) as $subject) {
                          $subject = trim($subject);
                          if ($subject === '') {
                              continue;
                          }
                          if (preg_match('/^Bump version to /i', $subject)) {
                              continue;
                          }
                          $bullets[] = $subject;
                      }
                  }
                  if ($bullets === []) {
                      fwrite(STDERR, "No Changelog entry for {$new_version} and no commits since {$prev_tag} to generate one.\n");
                      fwrite(STDERR, "Add \"= {$new_version} =\" under == Changelog == in {$readme} before releasing, or ensure there are commits since the previous tag.\n");
                      exit(1);
                  }

                  $section = "= {$new_version} =\n\n";
                  foreach ($bullets as $subject) {
                      $section .= '* ' . $subject . "\n";
                  }
                  $section .= "\n";

                  $readme_updated = preg_replace(
                      '/^(== Changelog ==\s*\n)/m',
                      '$1' . "\n" . $section,
                      $readme_updated,
                      1,
                      $changelog_count
                  );
                  if ($readme_updated === null || $changelog_count !== 1) {
                      fwrite(STDERR, "Failed to insert Changelog section for {$new_version}\n");
                      exit(1);
                  }
                  echo "Inserted Changelog section for {$new_version} from git history since {$prev_tag}\n";
              } else {
                  echo "Changelog already has a section for {$new_version}\n";
              }

              if (file_put_contents($readme, $readme_updated) === false) {
                  fwrite(STDERR, "Failed to write {$readme}\n");
                  exit(1);
              }

              echo "Bumped version {$previous_version} -> {$new_version} ({$bump})\n";
          }

          $tag = 'v' . $new_version;
          $output = getenv('GITHUB_OUTPUT');
          if ($output === false || $output === '') {
              fwrite(STDERR, "GITHUB_OUTPUT is not set\n");
              exit(1);
          }
          file_put_contents($output, "mode={$mode}\n", FILE_APPEND);
          file_put_contents($output, "previous={$previous_version}\n", FILE_APPEND);
          file_put_contents($output, "version={$new_version}\n", FILE_APPEND);
          file_put_contents($output, "tag={$tag}\n", FILE_APPEND);
          file_put_contents($output, 'changed=' . ($changed_files ? 'true' : 'false') . "\n", FILE_APPEND);
          echo "Resolved tag {$tag} (mode={$mode})\n";
          PHP

      - name: Commit version bump
        if: steps.version.outputs.changed == 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp-api-for-elementor.php readme.txt
          git commit -m "Bump version to ${VERSION}"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find mcp-api-for-elementor.php includes -name '*.php' -print0)

      - name: PHPCS
        run: composer lint

      - name: PHPUnit
        run: composer test

      - name: Stage plugin package for Plugin Check
        run: |
          set -euo pipefail
          SLUG="mcp-api-for-elementor"
          DEST="${GITHUB_WORKSPACE}/.plugin-check-build/${SLUG}"
          mkdir -p "${DEST}/includes"
          cp mcp-api-for-elementor.php "${DEST}/"
          cp includes/*.php "${DEST}/includes/"
          cp includes/instructions-guidance.md "${DEST}/includes/"
          cp readme.txt LICENSE "${DEST}/"

      - name: Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./.plugin-check-build/mcp-api-for-elementor
          slug: mcp-api-for-elementor

      - name: Delete existing GitHub release and tag
        if: steps.version.outputs.mode == 'rerelease'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Removing existing release/tag for ${TAG} (if present)..."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release delete "${TAG}" --yes
            echo "Deleted GitHub release ${TAG}"
          else
            echo "No GitHub release named ${TAG}"
          fi
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git tag -d "${TAG}"
            echo "Deleted local tag ${TAG}"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git push origin ":refs/tags/${TAG}"
            echo "Deleted remote tag ${TAG}"
          else
            echo "No remote tag ${TAG}"
          fi

      - name: Ensure tag does not already exist
        if: steps.version.outputs.mode == 'bump'
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin."
            exit 1
          fi

      - name: Build plugin zip
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          SLUG="mcp-api-for-elementor"
          STAGE="$(mktemp -d)"
          DEST="${STAGE}/${SLUG}"
          mkdir -p "${DEST}/includes"

          cp mcp-api-for-elementor.php "${DEST}/"
          cp includes/*.php "${DEST}/includes/"
          cp includes/instructions-guidance.md "${DEST}/includes/"
          cp readme.txt LICENSE "${DEST}/"

          ZIP_NAME="${SLUG}-${VERSION}.zip"
          (
            cd "${STAGE}"
            zip -r "${GITHUB_WORKSPACE}/${ZIP_NAME}" "${SLUG}"
          )
          echo "Built ${ZIP_NAME}"
          unzip -l "${ZIP_NAME}"
          unzip -l "${ZIP_NAME}" | grep -q 'instructions-guidance.md'

      - name: Push branch and tag
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ github.ref_name }}"
          MODE="${{ steps.version.outputs.mode }}"
          # Annotated tags need an identity even when rerelease skips the bump commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${VERSION}"
          if [[ "${MODE}" == "bump" ]]; then
            git push origin "HEAD:refs/heads/${BRANCH}"
          fi
          git push origin "${TAG}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: mcp-api-for-elementor-${{ steps.version.outputs.version }}.zip
