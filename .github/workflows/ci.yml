name: CI

on:
  push:
    branches: [edge]
  pull_request:
    branches: [edge]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-8.1-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-8.1-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find mcp-api-for-elementor.php includes -name '*.php' -print0)

      - name: PHPCS
        run: composer lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: vendor
          key: composer-${{ runner.os }}-8.1-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-8.1-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: composer test

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Same file set as the release zip — do not scan repo tooling/docs/tests.
      - name: Stage plugin package
        run: |
          set -euo pipefail
          SLUG="mcp-api-for-elementor"
          DEST="${GITHUB_WORKSPACE}/.plugin-check-build/${SLUG}"
          mkdir -p "${DEST}/includes"
          cp mcp-api-for-elementor.php "${DEST}/"
          cp includes/*.php "${DEST}/includes/"
          cp includes/instructions-guidance.md "${DEST}/includes/"
          cp readme.txt LICENSE "${DEST}/"
          echo "Staged plugin at ${DEST}"
          find "${DEST}" -type f | sort

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: ./.plugin-check-build/mcp-api-for-elementor
          slug: mcp-api-for-elementor
          strict: "true"
